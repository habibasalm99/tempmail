<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temp Mail - عارضی ای میل سروس</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .box {
      background: #1e293b;
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      text-align: center;
    }
    .email-display {
      font-size: 1.2rem;
      background: #334155;
      padding: 10px;
      border-radius: 6px;
      margin: 15px 0;
      word-break: break-all;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      margin: 5px;
    }
    button:hover {
      background: #1d4ed8;
    }
    .inbox {
      margin-top: 20px;
      text-align: left;
    }
    .mail-item {
      background: #334155;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    .mail-item h4 { margin: 0 0 5px 0; color: #38bdf8; }
    .mail-item p { margin: 0; font-size: 0.9rem; }
  </style>
</head>
<body>

  <div class="box">
    <h2>آپ کا عارضی ای میل ایڈریس</h2>
    <div id="email" class="email-display">ای میل تیار ہو رہا ہے...</div>
    <button onclick="copyEmail()">ای میل کاپی کریں</button>
    <button onclick="generateNewEmail()">نیا ای میل بنائیں</button>

    <div class="inbox">
      <h3>ان باکس (Inbox / OTP)</h3>
      <div id="messages">کوئی نیا پیغام نہیں...</div>
    </div>
  </div>

  <script>
    let currentEmail = "";
    let user = "";
    let domain = "";

    async function generateNewEmail() {
      user = Math.random().toString(36).substring(2, 10);
      domain = "1secmail.com";
      currentEmail = `${user}@${domain}`;
      document.getElementById("email").innerText = currentEmail;
      document.getElementById("messages").innerHTML = "ان باکس چیک کیا جا رہا ہے...";
      checkMail();
    }

    function copyEmail() {
      navigator.clipboard.writeText(currentEmail);
      alert("ای میل کاپی ہو گیا ہے!");
    }

    async function checkMail() {
      if (!user || !domain) return;
      try {
        const res = await fetch(`https://www.1secmail.com/api/v1/?action=getMessages&login=${user}&domain=${domain}`);
        const data = await res.json();
        
        const messagesContainer = document.getElementById("messages");
        if (data.length === 0) {
          messagesContainer.innerHTML = "<p>کوئی نیا پیغام نہیں آیا...</p>";
        } else {
          messagesContainer.innerHTML = "";
          for (let mail of data) {
            const mailRes = await fetch(`https://www.1secmail.com/api/v1/?action=readMessage&login=${user}&domain=${domain}&id=${mail.id}`);
            const mailData = await mailRes.json();
            
            const div = document.createElement("div");
            div.className = "mail-item";
            div.innerHTML = `
              <h4>از: ${mailData.from}</h4>
              <p><strong>موضوع:</strong> ${mailData.subject}</p>
              <hr style="border-color:#475569;">
              <p>${mailData.textBody || mailData.htmlBody}</p>
            `;
            messagesContainer.appendChild(div);
          }
        }
      } catch (err) {
        console.error("ای میل لوڈ کرنے میں مسئلہ:", err);
      }
    }

    // ہر 5 سیکنڈ میں ان باکس آٹو ریفریش ہوگا
    setInterval(checkMail, 5000);
    generateNewEmail();
  </script>

</body>
</html>
