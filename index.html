<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DropBox Mail – temporary inbox</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#14202e;--mute:#5d6b7c;--line:#d7dee8;--acc:#1f5eff;--accink:#fff;--ok:#0e8a5f}
@media (prefers-color-scheme:dark){:root{--bg:#0e141c;--card:#17202b;--ink:#e8eef6;--mute:#93a1b3;--line:#2a3646;--acc:#5b8cff;--accink:#0b1220;--ok:#3fd09b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif;padding:24px 16px}
main{max-width:860px;margin:0 auto}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.addr{padding:20px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.addr output{flex:1 1 260px;font:600 1.25rem/1.3 Consolas,monospace;word-break:break-all}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px;cursor:pointer}
button.p{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.grid{display:grid;grid-template-columns:300px 1fr;margin-top:16px;min-height:360px;overflow:hidden}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
.list{border-right:1px solid var(--line);overflow:auto;max-height:520px}
.head{padding:12px 16px;border-bottom:1px solid var(--line);color:var(--mute);font-size:.9rem;display:flex;justify-content:space-between}
.item{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 16px}
.item.on{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.item b,.item span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item span{color:var(--mute);font-size:.88rem}
.view{padding:18px 20px;overflow:auto;max-height:520px}
.view h2{margin:0 0 4px;font-size:1.15rem}
.meta{color:var(--mute);font-size:.9rem;margin-bottom:14px}
.body{white-space:pre-wrap;word-break:break-word}
.otp{display:inline-flex;gap:8px;align-items:center;background:color-mix(in srgb,var(--ok) 14%,transparent);border:1px solid var(--ok);border-radius:10px;padding:8px 12px;margin:0 8px 14px 0}
.otp code{font:700 1.4rem Consolas,monospace;letter-spacing:.12em}
.empty{padding:40px 20px;color:var(--mute);text-align:center}
.err{color:#d23b3b;padding:8px 20px}
</style>
</head>
<body>
<main>
  <h1>DropBox Mail</h1>
  <p class="sub">Temporary email. Copy the address, use it to sign up, and the OTP shows up below.</p>

  <section class="card addr" aria-label="Your temporary address">
    <output id="addr" aria-live="polite">Creating address…</output>
    <button class="p" id="copy">Copy address</button>
    <button id="new">New address</button>
  </section>
  <div class="err" id="err" role="alert"></div>

  <section class="card grid">
    <div class="list">
      <div class="head"><span>Inbox</span><span id="status">Waiting…</span></div>
      <div id="items"><div class="empty">No emails yet. This page checks every 5 seconds.</div></div>
    </div>
    <div class="view" id="view"><div class="empty">Select an email to read it.</div></div>
  </section>
</main>

<script>
const API = "https://api.mail.tm";
let token = null, acct = null, seen = {}, current = null, timer = null;
const $ = id => document.getElementById(id);

async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    ...opts,
    headers: { "Content-Type": "application/json", ...(token ? { Authorization: "Bearer " + token } : {}) }
  });
  if (!r.ok) throw new Error("Server error " + r.status);
  return r.json();
}
const rand = n => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => "abcdefghijklmnopqrstuvwxyz0123456789"[b % 36]).join("");

async function createAccount() {
  $("err").textContent = ""; $("addr").textContent = "Creating address…";
  $("items").innerHTML = '<div class="empty">No emails yet. This page checks every 5 seconds.</div>';
  $("view").innerHTML = '<div class="empty">Select an email to read it.</div>';
  seen = {}; current = null; token = null;
  try {
    const d = await api("/domains");
    const domain = d["hydra:member"][0].domain;
    const address = rand(10) + "@" + domain, password = rand(16);
    await api("/accounts", { method: "POST", body: JSON.stringify({ address, password }) });
    const t = await api("/token", { method: "POST", body: JSON.stringify({ address, password }) });
    token = t.token; acct = address;
    $("addr").textContent = address;
    poll();
  } catch (e) {
    $("addr").textContent = "—";
    $("err").textContent = "Could not create an address (" + e.message + "). Check your internet and press New address.";
  }
}

async function poll() {
  clearTimeout(timer);
  if (!token) return;
  try {
    const m = await api("/messages");
    const list = m["hydra:member"];
    $("status").textContent = list.length + " email" + (list.length === 1 ? "" : "s");
    if (list.length) {
      $("items").innerHTML = "";
      list.forEach(x => {
        const b = document.createElement("button");
        b.className = "item" + (x.id === current ? " on" : "");
        const f = document.createElement("b"); f.textContent = x.from.name || x.from.address;
        const s = document.createElement("span"); s.textContent = x.subject || "(no subject)";
        b.append(f, s);
        b.onclick = () => open(x.id);
        $("items").append(b);
        if (!seen[x.id]) { seen[x.id] = 1; if (Object.keys(seen).length === 1) open(x.id); }
      });
    }
  } catch (e) { $("status").textContent = "Retrying…"; }
  timer = setTimeout(poll, 5000);
}

async function open(id) {
  current = id;
  const m = await api("/messages/" + id);
  const text = m.text || m.intro || "";
  const codes = [...new Set((m.subject + " " + text).match(/\b\d{4,8}\b/g) || [])].slice(0, 3);
  const v = $("view"); v.innerHTML = "";
  const h = document.createElement("h2"); h.textContent = m.subject || "(no subject)";
  const meta = document.createElement("div"); meta.className = "meta";
  meta.textContent = "From " + (m.from.name ? m.from.name + " <" + m.from.address + ">" : m.from.address) + " • " + new Date(m.createdAt).toLocaleString();
  v.append(h, meta);
  codes.forEach(c => {
    const o = document.createElement("div"); o.className = "otp";
    const code = document.createElement("code"); code.textContent = c;
    const b = document.createElement("button"); b.textContent = "Copy OTP";
    b.onclick = () => { navigator.clipboard.writeText(c); b.textContent = "Copied"; };
    o.append(code, b); v.append(o);
  });
  const body = document.createElement("div"); body.className = "body"; body.textContent = text;
  v.append(body);
  poll();
}

$("copy").onclick = () => { if (acct) { navigator.clipboard.writeText(acct); $("copy").textContent = "Copied"; setTimeout(() => $("copy").textContent = "Copy address", 1500); } };
$("new").onclick = createAccount;
createAccount();
</script>
</body>
</html>
